name: Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: FaintRec
  PACKAGE_NAME: com.faintrec.app
  DEFAULT_VERSION_NAME: "1.0.0"
  VERSION_CODE: ${{ github.run_number }}
  DEFAULT_GRADLE_VERSION: "9.3.1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Get version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${DEFAULT_VERSION_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Detect project folder and Gradle version
        id: proj
        run: |
          SETTINGS="$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found. Project files are missing in the repo."
            ls -la
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$DIR/gradlew" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          PROPS="$DIR/gradle/wrapper/gradle-wrapper.properties"
          GV=""
          if [ -f "$PROPS" ]; then
            GV="$(grep -oP 'gradle-\K[0-9.]+(?=-(bin|all))' "$PROPS" | head -n 1 || true)"
          fi
          if [ -z "$GV" ]; then
            GV="$DEFAULT_GRADLE_VERSION"
          fi
          echo "gradle=$GV" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"
          echo "Gradle version: $GV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.proj.outputs.gradle }}

      - name: Create debug keystore
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d app ] && [ ! -f app/debug.keystore ]; then
            cp debug.keystore app/debug.keystore
          fi

      - name: Build info
        run: |
          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Project dir: ${{ steps.proj.outputs.dir }}"
          echo "Gradle: ${{ steps.proj.outputs.gradle }}"

      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore secrets missing. Building debug APK instead."
          fi

      - name: Decode release keystore
        if: steps.sign.outputs.signed == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release (APK + AAB)
        if: steps.sign.outputs.signed == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.proj.outputs.wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          else
            gradle assembleRelease bundleRelease -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          fi

      - name: Build debug APK (fallback)
        if: steps.sign.outputs.signed != 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ "${{ steps.proj.outputs.wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          else
            gradle assembleDebug -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          fi

      - name: Collect and rename outputs
        run: |
          mkdir -p dist
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            APK="$(find . -path '*outputs/apk/release/*.apk' | head -n 1)"
            AAB="$(find . -path '*outputs/bundle/release/*.aab' | head -n 1)"
            [ -n "$APK" ] || { echo "::error::Release APK not found"; exit 1; }
            cp "$APK" "dist/${APP_NAME}-${VERSION_NAME}.apk"
            [ -n "$AAB" ] && cp "$AAB" "dist/${APP_NAME}-${VERSION_NAME}.aab"
          else
            APK="$(find . -path '*outputs/apk/debug/*.apk' | head -n 1)"
            [ -n "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
            cp "$APK" "dist/${APP_NAME}-${VERSION_NAME}-debug.apk"
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION_NAME }}-release-files
          path: dist/*
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION_NAME }}
          files: dist/*
          generate_release_notes: true

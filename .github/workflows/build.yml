name: Build Network messenger APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: "Network messenger"
  PACKAGE_NAME: "com.network.messenger"
  APP_VERSION: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check app identity (package and version)
        run: |
          grep -rq "$PACKAGE_NAME" app/build.gradle* || { echo "applicationId must be $PACKAGE_NAME"; exit 1; }
          grep -E "versionName" app/build.gradle* | grep -q "$APP_VERSION" || { echo "versionName must be $APP_VERSION"; exit 1; }
          echo "Building $APP_NAME ($PACKAGE_NAME) v$APP_VERSION"

      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/Network-messenger-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Network-messenger-v${{ env.APP_VERSION }}
          path: dist/*.apk

      - name: Create GitHub release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.APP_NAME }} v${{ env.APP_VERSION }}"
          files: dist/*.apk

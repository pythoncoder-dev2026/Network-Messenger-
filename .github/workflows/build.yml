name: Build Network messenger APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: "Network messenger"
  PACKAGE_NAME: "com.network.messenger"
  APP_VERSION: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Find project folder
        run: |
          SETTINGS=$(find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found. Upload the full Android project."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"
          ls -la "$DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK
        run: |
          APK=$(find . -path "*build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK was produced."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/Network-messenger-v$APP_VERSION.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Network-messenger-APK
          path: dist/*.apk

      - name: Create GitHub release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Network messenger v1.0.0"
          files: dist/*.apk

name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path '*/.*' | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Detected Android project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "Debug APK not found after assembleDebug"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/dist/Network-messenger-v1.0.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Network-messenger-APK
          path: dist/Network-messenger-v1.0.0.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Network-messenger-v1.0.0.apk
